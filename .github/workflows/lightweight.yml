name: Lightweight build

on:
  push:
    branches: [lightweight-rewrite]
    paths: ["lightweight/**", ".github/workflows/lightweight.yml"]
  pull_request:
    paths: ["lightweight/**"]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightweight/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_roblox_lookup

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lightweight
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release --features gui
      - uses: actions/upload-artifact@v4
        with:
          name: rust-app
          path: lightweight/target/release/rbx_alt_manager.exe

  csharp:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lightweight/csharp/RobloxProcessLookup
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild RobloxProcessLookup.csproj /restore /p:Configuration=Release
      - name: Stage helper and its DLLs
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          $exe = Get-ChildItem -Recurse -Filter RobloxProcessLookup.exe -Path bin/Release | Select-Object -First 1
          Copy-Item (Join-Path $exe.DirectoryName '*') staging/ -Recurse -Force
          Get-ChildItem staging
      - uses: actions/upload-artifact@v4
        with:
          name: csharp-helper
          path: lightweight/csharp/RobloxProcessLookup/staging/

  package:
    needs: [rust, csharp]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-app
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: csharp-helper
          path: dist
      - run: Get-ChildItem -Recurse dist
      - uses: actions/upload-artifact@v4
        with:
          name: RBX-Alt-Manager-Lite
          path: dist
